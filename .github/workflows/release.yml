name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

# Never cancel a half-published release: a cancelled run can leave a tag with
# a release but no assets.
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package and publish
    # Windows on purpose: this ships a Windows installer kit and must be built
    # with Windows path and Compress-Archive semantics.
    runs-on: windows-latest

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v') {
            Write-Host "::error::Release tag must start with 'v'. Got '$tag'."
            exit 1
          }
          Write-Host "Release tag: $tag"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"

      - name: Package installer kit
        id: package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG -OutDir dist

      - name: Verify release asset
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: ./scripts/verify-release.ps1 -ZipPath $env:ZIP_PATH -Tag $env:RELEASE_TAG

      - name: Compose release notes
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          BINARY_INCLUDED: ${{ steps.package.outputs.binary_included }}
          CERT_INCLUDED: ${{ steps.package.outputs.cert_included }}
          DRIVER_SHA256: ${{ steps.package.outputs.driver_sha256 }}
        run: |
          # binary_included can no longer be false: the driver is tracked in git
          # and packaging fails without it. Kept as a tripwire so a kit that
          # somehow ships without the driver never reaches users.
          if ($env:BINARY_INCLUDED -ne 'true') {
            Write-Host "::error::Packaging reported binary_included=$env:BINARY_INCLUDED. The kit must ship apple-driver\applewirelessmouse.sys."
            exit 1
          }

          $notes = @(
            "Magic Mouse v3 Windows scroll fix $env:RELEASE_TAG"
            ''
            "Asset:  $env:ZIP_NAME"
            "SHA256: $env:ZIP_SHA256"
            ''
            'Verify the download before running anything:'
            ''
            '    certutil -hashfile ' + $env:ZIP_NAME + ' SHA256'
            ''
            '## Prerequisites'
            ''
            'Install-MagicMousePatch.ps1 enforces these and refuses to run otherwise:'
            ''
            '- Windows 10 build 14393 (1607) or later, x64, elevated.'
            '- Fast Startup OFF (`HiberbootEnabled` must be 0):'
            '  `powercfg /h off`, then reboot. With Fast Startup on the install'
            '  silently fails.'
            ''
            'Test Signing and HVCI / Memory Integrity are NOT prerequisites of this'
            'download. They applied to the legacy patched-and-re-signed driver, which'
            'is no longer shipped. The driver in this asset is Apple''s own, unmodified'
            'and Microsoft-countersigned, so Test Mode is EXPECTED not to be required'
            'and Secure Boot / Memory Integrity should be able to stay ON. That is NOT'
            'yet verified on a machine with test signing off - this project''s'
            'development PC runs with testsigning on. After the reboot, confirm the'
            'driver really loaded:'
            ''
            '    sc query applewirelessmouse'
            ''
            '## Install'
            ''
            '1. Extract the whole ZIP, keeping its folders. Install.cmd finds the'
            '   installer and the driver relative to itself.'
            '2. Verify `SHA256SUMS` against the extracted files.'
            '3. Double-click `Install.cmd`. It requests Administrator itself, so there'
            '   is nothing to type and no execution policy to change.'
            '4. Reboot.'
            ''
            'Advanced: from an elevated prompt, run'
            '`installer\Install-MagicMousePatch.ps1 -DriverPath <applewirelessmouse.sys>`'
            'instead - for example to install a copy from your own Boot Camp files.'
            ''
            'Rollback: `installer\Uninstall-MagicMousePatch.ps1`, elevated, then reboot.'
            ''
            '## Driver binary'
            ''
            'This asset ships Apple''s unmodified `applewirelessmouse.sys` as'
            '`apple-driver\applewirelessmouse.sys`:'
            ''
            "    SHA256: $env:DRIVER_SHA256"
            ''
            'Packaging hashed that file and refused to publish unless it matched the'
            'checksum published for it in `installer\SHA256SUMS.txt`. The installer'
            'accepts a driver on its Authenticode status, signer subject and PE'
            'OriginalFilename rather than on a pinned hash, because Apple has shipped'
            'more than one Boot Camp build; a modified or unsigned binary is rejected.'
            'Apple retains copyright in the file - see the bundled `DMCA-NOTICE.md`.'
          )

          if ($env:CERT_INCLUDED -eq 'true') {
            $notes += @(
              ''
              'This asset also carries `installer\MagicMouseFix.cer`, which belongs to'
              'the legacy patched variant only. The Apple driver route neither imports'
              'nor needs it.'
            )
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_NOTES=$notesPath"
          Get-Content -LiteralPath $notesPath | Out-Host

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: |
          gh release create $env:RELEASE_TAG `
            "$env:ZIP_PATH" `
            "$env:ZIP_PATH.sha256" `
            --title $env:RELEASE_TAG `
            --notes-file $env:RELEASE_NOTES `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release create failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
