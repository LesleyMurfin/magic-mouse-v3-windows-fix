name: AutoAgent Autonomous Harness Optimizer

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of optimization iterations'
        required: false
        default: '10'

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize-harness:
    name: Autonomous Agent Harness Hill-Climbing Optimization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & AutoAgent harness
        run: |
          uv sync --all-extras --dev

      - name: Run Baseline Benchmark Evaluation
        run: |
          echo "Establishing baseline harness benchmark score..."
          uv run pytest tests/evals/ -v --junitxml=baseline-results.xml

      - name: Run AutoAgent Optimization Loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running AutoAgent harness optimization loop (Kevin Gu / Third Layer pattern)..."
          # AutoAgent iterates on agent.py & prompt specs, evaluating task verifiers
          uv run python -m autoagent --program program.md --max-iterations ${{ github.event.inputs.iterations || 10 }}

      - name: Create PR if Score Improved
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'perf(harness): autonomous prompt & tool harness optimization'
          title: 'perf(harness): autonomous prompt & tool harness optimization'
          body: |
            ## AutoAgent Autonomous Optimization Report
            - **Original Score**: Baseline
            - **Improved Score**: Higher verifier pass rate achieved
            - **Files Modified**: `agent.py` / prompt specifications
            - **Optimization Method**: AutoAgent hill-climbing over task verifiers
          branch: autoagent/harness-optimization
          base: main
          labels: |
            automerge-candidate
            area/ai-harness
